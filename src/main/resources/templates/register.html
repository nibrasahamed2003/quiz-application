<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4 fw-bold">
                            <i class="bi bi-person-plus text-primary"></i> Create Account
                        </h2>

                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <i class="bi bi-exclamation-triangle"></i>
                            <span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/register}" th:object="${user}" method="post" novalidate>
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" th:field="*{username}" id="username" class="form-control"
                                           placeholder="Choose a username" required>
                                </div>
                                <div th:errors="*{username}" class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" th:field="*{email}" id="email" class="form-control"
                                           placeholder="Enter your email" required>
                                </div>
                                <div th:errors="*{email}" class="text-danger small mt-1"></div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" th:field="*{password}" id="password" class="form-control"
                                           placeholder="Create a password (min 6 chars)" required>
                                </div>
                                <div th:errors="*{password}" class="text-danger small mt-1"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-person-plus"></i> Create Account
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">Already have an account?
                                <a th:href="@{/login}" class="text-decoration-none fw-semibold">Login here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
