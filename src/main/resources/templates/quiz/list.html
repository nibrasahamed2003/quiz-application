<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('My Quizzes')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: messages}"></div>

    <div class="container mt-4 mb-5">
        <!-- User Portal Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0"><i class="bi bi-lightning-charge text-primary"></i> My Quiz Portal</h2>
        </div>

        <!-- My Results Summary -->
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-header bg-warning text-dark fw-semibold">
                <i class="bi bi-trophy-fill"></i> My Quiz Results
            </div>
            <div class="card-body">
                <div th:if="${results.isEmpty()}" class="text-center py-3">
                    <p class="text-muted mb-0">You haven't taken any quizzes yet. Browse the quizzes below and start!</p>
                </div>
                <div th:if="${!results.isEmpty()}" class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Quiz</th>
                                <th>Score</th>
                                <th>Percentage</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="result : ${results}">
                                <td>
                                    <a th:href="@{/quiz/{id}(id=${result.quiz.id})}" th:text="${result.quiz.title}"></a>
                                </td>
                                <td th:text="${result.score} + '/' + ${result.totalQuestions}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${result.percentage >= 80} ? 'bg-success' : (${result.percentage >= 50} ? 'bg-warning' : 'bg-danger')"
                                          th:text="${#numbers.formatDecimal(result.percentage, 1, 1)} + '%'"></span>
                                </td>
                                <td th:text="${#temporals.format(result.completedAt, 'dd MMM yyyy HH:mm')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Available Quizzes -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-success text-white fw-semibold">
                <i class="bi bi-collection-fill"></i> Available Quizzes
            </div>
            <div class="card-body">
                <div th:if="${quizzes.isEmpty()}" class="text-center py-5">
                    <i class="bi bi-inbox display-1 text-muted"></i>
                    <p class="text-muted mt-2">No quizzes available yet. Check back later!</p>
                </div>
                <div class="row g-4" th:if="${!quizzes.isEmpty()}">
                    <div class="col-md-6 col-lg-4" th:each="quiz : ${quizzes}">
                        <div class="card h-100 border shadow-sm quiz-card">
                            <div class="card-body">
                                <h5 class="card-title fw-bold" th:text="${quiz.title}"></h5>
                                <p class="card-text text-muted" th:text="${quiz.description}"></p>
                                <p class="small text-muted mb-0">
                                    <i class="bi bi-person"></i> Created by:
                                    <span th:text="${quiz.createdBy.username}"></span>
                                </p>
                            </div>
                            <div class="card-footer bg-white border-top-0">
                                <a th:href="@{/quiz/{id}(id=${quiz.id})}" class="btn btn-success btn-sm">
                                    <i class="bi bi-eye"></i> View &amp; Take
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
