<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Quiz Details')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: messages}"></div>

    <div class="container mt-4 mb-5">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0 fw-bold" th:text="${quiz.title}"></h3>
            </div>
            <div class="card-body">
                <p class="text-muted" th:text="${quiz.description}"></p>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-person text-primary me-2"></i>
                            <span>Created by: <strong th:text="${quiz.createdBy.username}"></strong></span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-question-circle text-info me-2"></i>
                            <span>Questions: <strong th:text="${questionCount}"></strong></span>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-calendar text-secondary me-2"></i>
                            <span>Created: <strong th:text="${#temporals.format(quiz.createdAt, 'dd MMM yyyy')}"></strong></span>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <a th:if="${!hasTaken}" th:href="@{/quiz/{id}/take(id=${quiz.id})}" class="btn btn-success btn-lg">
                        <i class="bi bi-play-circle"></i> Take Quiz
                    </a>
                    <span th:if="${hasTaken}" class="btn btn-secondary btn-lg disabled">
                        <i class="bi bi-check-circle"></i> Already Completed
                    </span>
                    <a th:href="@{/quiz/list}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Back to Quizzes
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
