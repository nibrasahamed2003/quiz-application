spring.application.name=quiz-application

# Server Configuration
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# Database Configuration - Auto-detects MySQL (local) or PostgreSQL (Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quizdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Auto-detect driver based on URL
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Auto-detect dialect (remove hardcoded MySQL dialect)
# spring.jpa.properties.hibernate.dialect=

# Thymeleaf Configuration
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.root=${LOG_LEVEL:INFO}
