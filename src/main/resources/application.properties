spring.application.name=quiz-application

# Server Configuration
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# Database Configuration
# For Render: DATABASE_URL environment variable will be in format: postgresql://user:pass@host/db
# We need to convert it to JDBC format
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/quizdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Note: If using Render's DATABASE_URL, it will be auto-converted by Spring Boot

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Dialect auto-detected by Hibernate based on database connection

# PostgreSQL SSL Configuration (required for Render)
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# Thymeleaf Configuration
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.root=${LOG_LEVEL:INFO}
