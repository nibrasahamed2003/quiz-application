<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quiz Details')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar}"></nav>
    <div th:replace="~{fragments :: messages}"></div>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0"><i class="bi bi-eye text-primary"></i> Quiz Details</h2>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Quiz Info -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0 fw-bold" th:text="${quiz.title}"></h3>
            </div>
            <div class="card-body">
                <p class="text-muted" th:text="${quiz.description}"></p>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <i class="bi bi-person text-primary me-2"></i>
                        Created by: <strong th:text="${quiz.createdBy.username}"></strong>
                    </div>
                    <div class="col-md-4">
                        <i class="bi bi-question-circle text-info me-2"></i>
                        Questions: <strong th:text="${questions.size()}"></strong>
                    </div>
                    <div class="col-md-4">
                        <i class="bi bi-calendar text-secondary me-2"></i>
                        Created: <strong th:text="${#temporals.format(quiz.createdAt, 'dd MMM yyyy')}"></strong>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <form th:action="@{/admin/quiz/{id}/delete(id=${quiz.id})}" method="post"
                          onsubmit="return confirm('Are you sure you want to delete this quiz?')">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Delete Quiz
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Questions List -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-semibold">
                <i class="bi bi-question-circle text-info"></i> Questions (<span th:text="${questions.size()}"></span>)
            </div>
            <div class="card-body">
                <div th:each="question, iterStat : ${questions}" class="card mb-3 border">
                    <div class="card-header bg-light">
                        <strong>Q<span th:text="${iterStat.count}"></span>:</strong>
                        <span th:text="${question.questionText}"></span>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <p class="mb-1">
                                    <span class="badge bg-primary me-1">A</span>
                                    <span th:text="${question.optionA}"></span>
                                    <span th:if="${question.correctAnswer == 'A'}" class="badge bg-success ms-1">Correct</span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-1">
                                    <span class="badge bg-primary me-1">B</span>
                                    <span th:text="${question.optionB}"></span>
                                    <span th:if="${question.correctAnswer == 'B'}" class="badge bg-success ms-1">Correct</span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-1">
                                    <span class="badge bg-primary me-1">C</span>
                                    <span th:text="${question.optionC}"></span>
                                    <span th:if="${question.correctAnswer == 'C'}" class="badge bg-success ms-1">Correct</span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-1">
                                    <span class="badge bg-primary me-1">D</span>
                                    <span th:text="${question.optionD}"></span>
                                    <span th:if="${question.correctAnswer == 'D'}" class="badge bg-success ms-1">Correct</span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quiz Results -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white fw-semibold">
                <i class="bi bi-trophy text-warning"></i> Submissions for this Quiz (<span th:text="${quizResults.size()}"></span>)
            </div>
            <div class="card-body">
                <div th:if="${quizResults.isEmpty()}" class="text-center py-3">
                    <p class="text-muted mb-0">No one has taken this quiz yet.</p>
                </div>
                <div th:if="${!quizResults.isEmpty()}" class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>User</th>
                                <th>Score</th>
                                <th>Percentage</th>
                                <th>Completed</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="result : ${quizResults}">
                                <td th:text="${result.user.username}"></td>
                                <td th:text="${result.score} + '/' + ${result.totalQuestions}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${result.percentage >= 80} ? 'bg-success' : (${result.percentage >= 50} ? 'bg-warning' : 'bg-danger')"
                                          th:text="${#numbers.formatDecimal(result.percentage, 1, 1)} + '%'"></span>
                                </td>
                                <td th:text="${#temporals.format(result.completedAt, 'dd MMM yyyy HH:mm')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
