<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create Quiz')}"></head>
<body>
    <nav th:replace="~{fragments :: navbar}"></nav>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0"><i class="bi bi-plus-circle text-primary"></i> Create New Quiz</h2>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <form th:action="@{/admin/quiz/create}" method="post" id="quizForm">
            <!-- Quiz Details -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-primary text-white fw-semibold">
                    <i class="bi bi-info-circle"></i> Quiz Details
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Quiz Title</label>
                        <input type="text" id="title" name="title" class="form-control"
                               placeholder="Enter quiz title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea id="description" name="description" class="form-control" rows="3"
                                  placeholder="Describe what this quiz is about"></textarea>
                    </div>
                </div>
            </div>

            <!-- Questions -->
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-header bg-primary text-white fw-semibold d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-question-circle"></i> Questions</span>
                    <button type="button" class="btn btn-sm btn-light" onclick="addQuestion()">
                        <i class="bi bi-plus"></i> Add Question
                    </button>
                </div>
                <div class="card-body" id="questions-container">
                    <!-- First question will be added by JS -->
                </div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="bi bi-check-circle"></i> Create Quiz
                </button>
            </div>
        </form>
    </div>

    <footer th:replace="~{fragments :: footer}"></footer>

    <script th:src="@{/js/quiz-create.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            for (let i = 0; i < 3; i++) {
                addQuestion();
            }
        });
    </script>
</body>
</html>
